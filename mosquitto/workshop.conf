# Configuration Mosquitto pour le workshop Horizon 2080
# À copier dans /etc/mosquitto/conf.d/workshop.conf (fait par install.sh)

# Écoute sur toutes les interfaces réseau, port MQTT standard,
# pour que toute l'équipe puisse se connecter depuis son poste.
listener 1883 0.0.0.0

# /!\ ATTENTION : accès ANONYME, sans mot de passe.
# Acceptable pour un workshop sur un réseau local, à NE JAMAIS faire en production.
# (Cette ligne doit rester APRÈS "listener" : elle s'applique à ce listener.)
allow_anonymous true
